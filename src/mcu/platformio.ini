[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
upload_speed = 921600
upload_port = COM5
lib_deps =
    chris--a/Keypad@^3.1.1
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    madhephaestus/ESP32Servo@^1.2.1

build_flags =
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_FREERTOS_USE_TICKLESS_IDLE_NONE
    -D CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
    -D CONFIG_FREERTOS_USE_TRACE_FACILITY=1
    -D CONFIG_FREERTOS_USE_STATIC_ALLOCATORS=1
